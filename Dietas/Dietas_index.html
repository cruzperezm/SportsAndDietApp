<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Dietas - Figma Design</title>
  <link rel="stylesheet" href="style.css">
  <link rel="stylesheet" href="../footerheader/header.css">
  <link rel="stylesheet" href="../footerheader/footer.css">
  <link rel="stylesheet" href="../Home/home.css">
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:opsz,wght,FILL,GRAD@24,400,0,0" />
  <script src="../xlu-include-file.js"></script>
</head>
<body>
<header xlu-include-file="../footerheader/header.html"></header>

<main xlu-include-file="Dietas_grid-view.html"></main>

<footer xlu-include-file="../footerheader/footer.html"></footer>

<script>
  xLuIncludeFile();

  function inicializar() {
    const contenedor = document.getElementById('contenedor-dietas');
    const temp = document.getElementById('template-tarjeta');

    if (!contenedor || !temp) {
      setTimeout(inicializar, 100);
      return;
    }

    fetch('../data.json')
            .then(res => {
              if (!res.ok) throw new Error("No se encontró el data.json");
              return res.json();
            })
            .then(data => {
              data.dietas.forEach(dieta => {
                const clon = temp.content.cloneNode(true);
                clon.querySelector('.js-titulo').innerText = dieta.titulo;

                clon.querySelector('.js-imagen').src = dieta.imagen;
                clon.querySelector('.js-imagen').alt = dieta.titulo;

                clon.querySelector('.js-enlace').onclick = () => {
                  localStorage.setItem('dietaSeleccionada', dieta.id);
                  window.location.href = 'Plan_index.html';
                };
                contenedor.appendChild(clon);
              });
            })
            .catch(error => console.error("Error cargando dietas:", error));
  }

  window.addEventListener('load', () => {
    console.log("Página cargada, iniciando lógica...");
    if (typeof inicializar === 'function') inicializar();
    if (typeof cargarPlanDieta === 'function') cargarPlanDieta();
    if (typeof cargarPaginaReceta === 'function') cargarPaginaReceta();
  });
</script>
</body>
</html>
