<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Log In - Sports & Diet</title>
  <link rel="stylesheet" href="log-in.css" />
  <script src="../global.js"></script>
</head>
<body data-json-src="log-in-data.json" data-page-id="login">

<main class="wireframe-card">

  <div class="logo-placeholder">
    <img id="login-avatar" src="" alt="" class="user-avatar" />
  </div>

  <form class="wireframe-form" onsubmit="event.preventDefault();">

    <div id="login-inputs-container" style="width: 100%;"></div>

    <div id="login-buttons-container" class="button-row"></div>

    <div class="text-links">
      <p><span id="login-prefix"></span><a id="login-signup-link" href=""></a></p>
      <p id="login-forgot-text"></p>
    </div>

    <div id="login-social-container" class="icon-row"></div>

  </form>
</main>

</body>
</html>
