<div class="plan-wrapper" *ngIf="deporte">

  <button class="btn-regresar" (click)="volver()">
    <span class="material-symbols-outlined">arrow_back</span> Volver a Deportes
  </button>

  <header class="pill-header">
    <h1 class="titulo-pill">{{ deporte?.titulo }}</h1>
    <p class="subtitulo-pill">{{ deporte?.subtitulo }}</p>
  </header>

  <nav class="filtros-nav">
    <button (click)="toggleFiltro('todos')" [class.active]="filtrosActivos.length === 0">
      Todos
    </button>
    <!-- Aquí iteramos sobre los Grupos Musculares (Brazos, Piernas, etc.) -->
    <button *ngFor="let grupo of gruposDisponibles"
            (click)="toggleFiltro(grupo)"
            [class.active]="filtrosActivos.includes(grupo)">
      {{ grupo }}
    </button>
  </nav>

  <!-- Secciones de Principiante, Intermedio, Avanzado -->
  <section class="fase-seccion" *ngFor="let fase of deporte?.plan">
    <div class="header-fase">
      <!-- Mostramos el nombre de la fase -->
      <h2 class="momento-label">{{ fase.nivel || fase.nombre }}</h2>
    </div>

    <div class="carrusel-container">
      <!-- Flecha Izquierda -->
      <button class="flecha-nav" (click)="mover(-1, fase.nivel || fase.nombre)"
              *ngIf="getEjerciciosFiltrados(fase).length > 3">‹</button>

      <div class="grid-comidas">
        <!-- Tarjetas de Ejercicios -->
        <div class="card-comida"
             *ngFor="let ejercicio of getEjerciciosVisibles(fase)"
             [routerLink]="['/deportes/ejercicio', ejercicio.id]">
          <div class="card-img" [style.background-image]="'url(' + ejercicio.imagen + ')'">
            <div class="card-info">
              <h3>{{ ejercicio.nombre }}</h3>
            </div>
          </div>
        </div>
      </div>

      <!-- Flecha Derecha -->
      <button class="flecha-nav" (click)="mover(1, fase.nivel || fase.nombre)"
              *ngIf="getEjerciciosFiltrados(fase).length > 3">›</button>
    </div>
  </section>
</div>
