<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <link rel="stylesheet" href="Dashboard-Deporte.css"/>
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:opsz,wght,FILL,GRAD@20..48,100..700,0..1,-50..200" />
    <script src="../footerheader/global-header-footer.js"></script>
    <script src="/xlu-include-file.js"></script>
</head>
<body>
<main>
<div id="dashboard-deporte">
    <p class="text64" id="name"></p>
    <div class="rectangle-toggle">
        <a class="ellipse-toggle" href="Dashboard-Dieta.html"></a>
    </div>
    <div class="rectangle-container">
        <p class="text24" id="move-text"></p>
        <p class="text24" id="move-calories"></p>
        <p class="text24" id="exercise-text"></p>
        <p class="text24" id="exercise-calories"></p>
        <p class="text24" id="stand-text"></p>
        <p class="text24" id="stand-calories"></p>
    </div>
    <a class="cross-horizontal" id="r7" href="../Deporte/Deporte_index.html"></a>
    <a class="cross-vertical" id="r8" href="../Deporte/Deporte_index.html"></a>
    <p class="text20" id="train-text1"></p>
    <a class="cross-horizontal" id="r9" href="../Deporte/Deporte_index.html"></a>
    <a class="cross-vertical" id="r10" href="../Deporte/Deporte_index.html"></a>
    <p class="text20" id="train-text2"></p>
    <a class="cross-horizontal" id="r11" href="../Deporte/Deporte_index.html"></a>
    <a class="cross-vertical" id="r12" href="../Deporte/Deporte_index.html"></a>
    <p class="text20" id="train-text3"></p>
    <a class="cross-horizontal" id="r13" href="../Deporte/Deporte_index.html"></a>
    <a class="cross-vertical" id="r14" href="../Deporte/Deporte_index.html"></a>
    <p class="text20" id="train-text4"></p>
    <a class="cross-horizontal" id="r15" href="../Deporte/Deporte_index.html"></a>
    <a class="cross-vertical" id="r16" href="../Deporte/Deporte_index.html"></a>
    <p class="text20" id="train-text5"></p>
    <p class="text16" id="train-amount1"></p>
    <p class="text16" id="train-amount2"></p>
    <p class="text16" id="train-amount3"></p>
    <p class="text16" id="train-amount4"></p>
    <p class="text16" id="train-amount5"></p>
</div>
</main>
<footer xlu-include-file="/footerheader/footer.html"></footer>
<script>xLuIncludeFile()</script>
<script>
        fetch('data.json')
        .then(r => r.json())
        .then(data => {
        // Update User Name
        document.getElementById('name').innerText = data.usuario.nombre;

        // Update Activity Rings Stats (Move, Exercise, Stand)
        // Using data.actividades for these labels
        document.getElementById('move-text').innerText = data.actividades[0].nombre;
        document.getElementById('move-calories').innerText = data.actividades[0].valor;

        document.getElementById('exercise-text').innerText = data.actividades[1].nombre;
        document.getElementById('exercise-calories').innerText = data.actividades[1].valor;

        document.getElementById('stand-text').innerText = data.actividades[2].nombre;
        document.getElementById('stand-calories').innerText = data.actividades[2].valor;

            // Generate the Weekly Bars inside the existing .rectangle-container
            // We prepend them to ensure they appear at the top as seen in the images
            const container = document.querySelector('.rectangle-container');

            // Create a wrapper for the bars to keep them aligned
            const barsHtml = `
                <div style="display: flex; justify-content: space-around; align-items: flex-end; height: 200px; width: 100%; margin-bottom: 20px;">
                    ${data.deporte.semana.map(day => `
                        <div style="display: flex; flex-direction: column; align-items: center; height: 100%; justify-content: flex-end;">
                            <div class="bar-unit" style="width: 20px; background-color: #D1D5DB; border-radius: 10px; height: ${day.valor}%;"></div>
                            <p class="text16" style="margin-top: 8px;">${day.dia}</p>
                        </div>
                    `).join('')}
                </div>
            `;

            // Keep the existing text elements but add the bars above them
            const existingContent = container.innerHTML;
            container.innerHTML = barsHtml + existingContent;

            // Populate the bottom list (Exercises/Train)
            const exercises = data.deporte.ejercicios;
            for (let i = 1; i <= 5; i++) {
                const textElem = document.getElementById(`train-text${i}`);
                const amountElem = document.getElementById(`train-amount${i}`);
                if (textElem && amountElem && exercises[i-1]) {
                    textElem.innerText = exercises[i-1].nombre;
                    amountElem.innerText = exercises[i-1].valor;
                }
            }
        })
        .catch(error => console.error('Error loading JSON:', error));
</script>
</body>
</html>
