<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <link rel="stylesheet" href="Dashboard-Dieta.css"/>
    <meta name="viewport" content="width=device-width, initial-scale=0.5">
    <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:opsz,wght,FILL,GRAD@20..48,100..700,0..1,-50..200" />
    <script src="../footerheader/global-header-footer.js"></script>
    <script src="../xlu-include-file.js"></script>
</head>
<body>
<header xlu-include-file="../footerheader/header.html"></header>
<div id="dashboard-dieta">
    <p class="text64" id="name"></p>
    <div class="rectangle-toggle" id="r0">
        <a class="ellipse-toggle" id="e0" href="Dashboard-Deporte.html"></a>
    </div>
    <div class="rectangle-container" id="r1">
        <div class="ellipse-container" id="e1">
            <div class="ellipse" id="e2">
                <p class="text24" id="calories-goal"></p>
                <p class="text64" id="calories-amount"></p>
            </div>
        </div>
        <p class="text24" id="water-amount"></p>
        <p class="text16" id="water-text"></p>
        <p class="text24" id="fiber-amount"></p>
        <p class="text16" id="fiber-text"></p>
        <div class="rectangle-macros" id="protein-rectangle"></div>
        <p class="text16" id="protein-amount"></p>
        <p class="text24" id="protein-text"></p>
        <div class="rectangle-macros" id="fats-rectangle"></div>
        <p class="text16" id="fats-amount"></p>
        <p class="text24" id="fats-text"></p>
        <div class="rectangle-macros" id="carbs-rectangle"></div>
        <p class="text16" id="carbs-amount"></p>
        <p class="text24" id="carbs-text"></p>
        <div class="rectangle-macros" id="sodium-rectangle"></div>
        <p class="text16" id="sodium-amount"></p>
        <p class="text24" id="sodium-text"></p>
        <div class="rectangle-macros" id="sugar-rectangle"></div>
        <p class="text16" id="sugar-amount"></p>
        <p class="text24" id="sugar-text"></p>
    </div>
    <a class="cross-horizontal" id="r7" href="../Dietas/Dietas_index.html"></a>
    <a class="cross-vertical" id="r8" href="../Dietas/Dietas_index.html"></a>
    <p class="text20" id="diet-text1"></p>
    <a class="cross-horizontal" id="r9" href="../Dietas/Dietas_index.html"></a>
    <a class="cross-vertical" id="r10" href="../Dietas/Dietas_index.html"></a>
    <p class="text20" id="diet-text2"></p>
    <a class="cross-horizontal" id="r11" href="../Dietas/Dietas_index.html"></a>
    <a class="cross-vertical" id="r12" href="../Dietas/Dietas_index.html"></a>
    <p class="text20" id="diet-text3"></p>
    <a class="cross-horizontal" id="r13" href="../Dietas/Dietas_index.html"></a>
    <a class="cross-vertical" id="r14" href="../Dietas/Dietas_index.html"></a>
    <p class="text20" id="diet-text4"></p>
    <a class="cross-horizontal" id="r15" href="../Dietas/Dietas_index.html"></a>
    <a class="cross-vertical" id="r16" href="../Dietas/Dietas_index.html"></a>
    <p class="text20" id="diet-text5"></p>
    <p class="text16" id="diet-amount1"></p>
    <p class="text16" id="diet-amount2"></p>
    <p class="text16" id="diet-amount3"></p>
    <p class="text16" id="diet-amount4"></p>
    <p class="text16" id="diet-amount5"></p>
</div>
<script>
    fetch('data.json')
        .then(r => r.json())
        .then(data => {
            // Map Name and Calories
            document.getElementById('name').innerText = data.usuario.nombre;
            document.getElementById('calories-goal').innerText = data.dieta.calorias_objetivo;
            document.getElementById('calories-amount').innerText = data.dieta.calorias_totales;

            document.getElementById('water-amount').innerText = data.dieta.macros1[0].valor;
            document.getElementById('water-text').innerText = data.dieta.macros1[0].nombre;

            document.getElementById('fiber-amount').innerText = data.dieta.macros1[1].valor;
            document.getElementById('fiber-text').innerText = data.dieta.macros1[1].nombre;

            const m2 = data.dieta.macros2;

            document.getElementById('protein-amount').innerText = m2[0].valor;
            document.getElementById('protein-text').innerText = m2[0].nombre;

            document.getElementById('fats-amount').innerText = m2[1].valor;
            document.getElementById('fats-text').innerText = m2[1].nombre;

            document.getElementById('carbs-amount').innerText = m2[2].valor;
            document.getElementById('carbs-text').innerText = m2[2].nombre;

            document.getElementById('sodium-amount').innerText = m2[3].valor;
            document.getElementById('sodium-text').innerText = m2[3].nombre;

            document.getElementById('sugar-amount').innerText = m2[4].valor;
            document.getElementById('sugar-text').innerText = m2[4].nombre;

            const recetas = data.dieta.recetas;

            document.getElementById('diet-amount1').innerText = recetas[0].valor;
            document.getElementById('diet-text1').innerText = recetas[0].nombre;

            document.getElementById('diet-amount2').innerText = recetas[1].valor;
            document.getElementById('diet-text2').innerText = recetas[1].nombre;

            document.getElementById('diet-amount3').innerText = recetas[2].valor;
            document.getElementById('diet-text3').innerText = recetas[2].nombre;

            document.getElementById('diet-amount4').innerText = recetas[3].valor;
            document.getElementById('diet-text4').innerText = recetas[3].nombre;

            document.getElementById('diet-amount5').innerText = recetas[4].valor;
            document.getElementById('diet-text5').innerText = recetas[4].nombre;

        })
        .catch(error => console.error('Error loading JSON:', error));
</script>
<footer xlu-include-file="../footerheader/footer.html"></footer>
</body>
</html>
