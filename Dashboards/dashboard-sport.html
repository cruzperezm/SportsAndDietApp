<!DOCTYPE html>
<html>
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="styles.css">
    <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:opsz,wght,FILL,GRAD@20..48,100..700,0..1,-50..200" />
    <script src="../footerheader/global-header-footer.js"></script>
</head>
<body>
<div class="canvas">
    <p class="text1" id="name">...</p>
    <div class="ellipse11"></div>
    <div class="ellipse12"></div>

    <div class="rectangle79">
        <a href="dashboard-diet.html" class="ellipse15" style="left: 5px;"></a>
    </div>

    <div class="rectangle83" id="bars-container">
    </div>

    <div id="activities" style="position:absolute; top: 1300px; left: 75px; width: 1000px;"></div>
</div>

<script>
    fetch('data.json').then(r => r.json()).then(data => {
        document.getElementById('name').innerText = data.usuario.nombre;
        const container = document.getElementById('bars-container');
        // Mapeo manual para mantener tus posiciones exactas de X
        const xPositions = [122, 249, 376, 503, 630, 757, 884];
        container.innerHTML = data.deporte.barras.map((b, i) => `
                <div class="bar-unit" style="left: ${xPositions[i]}px; height: ${b.altura};"></div>
                <div style="position:absolute; left:${xPositions[i]}px; top:680px; font-size:40px;">${b.dia}</div>
            `).join('');
    });
</script>
</body>
</html>
