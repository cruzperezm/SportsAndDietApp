<!DOCTYPE html>
<html>
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="styles.css">
</head>
<body>
<div class="canvas">
    <p class="text1" id="name">...</p>
    <div class="ellipse11"></div>
    <div class="ellipse12"></div>

    <div class="rectangle79">
        <a href="dashboard-sport.html" class="ellipse15" style="left: 105px;"></a>
    </div>

    <div class="rectangle83">
        <div class="ellipse13">
            <div class="ellipse14">
                <p id="obj" style="margin-top:100px; font-size:40px;"></p>
                <p id="cal" style="font-size:100px; font-weight:bold; margin:0;"></p>
            </div>
        </div>
        <div id="macros-area"></div>
    </div>
</div>

<script>
    fetch('data.json').then(r => r.json()).then(data => {
        document.getElementById('name').innerText = data.usuario.nombre;
        document.getElementById('obj').innerText = data.dieta.objetivo;
        document.getElementById('cal').innerText = data.dieta.calorias;

        const area = document.getElementById('macros-area');
        const yPositions = [150, 350, 550];
        area.innerHTML = data.dieta.macros.map((m, i) => `
                <div style="position:absolute; left:600px; top:${yPositions[i]}px;">
                    <p style="font-size:32px; margin:0;">${m.nombre}</p>
                    <div style="width:300px; height:20px; background:#d9d9d9; border-radius:10px;"></div>
                    <p style="font-size:24px;">${m.valor}</p>
                </div>
            `).join('');
    });
</script>
</body>
</html>
