<ion-header>
  <ion-toolbar color="primary">
    <ion-title>Explorar y Favoritos</ion-title>
  </ion-toolbar>
</ion-header>

<ion-content>
  <ion-list>
    <ion-item *ngFor="let item of elementos" [routerLink]="['/detalle', item.id]" [button]="true">
      <ion-label>
        <h2>{{ item.titulo || item.nombre }}</h2>
        <p>{{ item.descripcion_corta }}</p>
      </ion-label>

      <ion-icon
        [name]="item.isFavorite ? 'star' : 'star-outline'"
        [color]="item.isFavorite ? 'warning' : 'medium'"
        slot="end">
      </ion-icon>

    </ion-item>
  </ion-list>

  <div *ngIf="elementos.length === 0" class="ion-padding ion-text-center">
    <p>No se encontraron elementos.</p>
  </div>
</ion-content>
