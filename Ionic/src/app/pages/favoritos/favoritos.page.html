<ion-header>
  <ion-toolbar color="primary">
    <ion-buttons slot="start"><ion-menu-button></ion-menu-button></ion-buttons>
    <ion-title>{{ getTitulo() }}</ion-title>
  </ion-toolbar>

  <ion-toolbar *ngIf="seccionActual === 'favoritos'">
    <ion-segment [value]="categoriaFavoritos" (ionChange)="cambiarTabFavoritos($event)" mode="md">
      <ion-segment-button value="dieta"><ion-label>DIETAS</ion-label></ion-segment-button>
      <ion-segment-button value="entrenamiento"><ion-label>DEPORTES</ion-label></ion-segment-button>
    </ion-segment>
  </ion-toolbar>
</ion-header>

<ion-content>
  <div *ngIf="cargando" class="ion-text-center ion-padding">
    <ion-spinner name="crescent"></ion-spinner>
  </div>

  <ion-list *ngIf="!cargando">
    <ion-item *ngFor="let item of elementosFiltrados" [routerLink]="['/detalle', item.id]" routerDirection="forward" [button]="true">
      <ion-avatar slot="start" style="background: #f0f0f0;">
        <ion-img [src]="item.imagen"></ion-img>
      </ion-avatar>
      <ion-label>
        <h2>{{ item.titulo || item.nombre }}</h2>
        <p>{{ item.descripcion_corta }}</p>
      </ion-label>
      <ion-icon slot="end" [name]="item.isFavorite ? 'heart' : 'heart-outline'"
                [color]="item.isFavorite ? 'danger' : 'medium'" (click)="toggleFavorito(item, $event)"></ion-icon>
    </ion-item>
  </ion-list>

  <div *ngIf="!cargando && elementosFiltrados.length === 0" class="ion-padding ion-text-center">
    <p>No hay elementos en esta sección.</p>
  </div>
</ion-content>
