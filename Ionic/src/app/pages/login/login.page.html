<ion-header>
  <ion-toolbar color="primary">
    <ion-title>Iniciar Sesión</ion-title>
  </ion-toolbar>
</ion-header>

<ion-content class="ion-padding">
  <div class="header-text ion-text-center">
    <h2>¡Hola de nuevo!</h2>
    <p>Ingresa tus credenciales para acceder a tu contenido.</p>
  </div>

  <form [formGroup]="loginForm" (ngSubmit)="onSubmit()">

    <ion-item lines="full" class="ion-margin-bottom">
      <ion-label position="stacked">Email</ion-label>
      <ion-input (keyup.enter)="gotoNextField(input2)" type="email" formControlName="email" class="native-input" placeholder="ejemplo@correo.com" />
    </ion-item>

    <ion-item lines="full" class="ion-margin-bottom">
      <ion-label position="stacked">Contraseña</ion-label>
      <ion-input #input2 type="password" formControlName="password" class="native-input" placeholder="******" />
    </ion-item>

    <ion-text color="danger" *ngIf="errorMessage">
      <p class="ion-text-center">{{ errorMessage }}</p>
    </ion-text>

    <div *ngIf="isLoading" class="ion-text-center ion-margin-top">
      <ion-spinner name="dots" color="primary"></ion-spinner>
      <p>Verificando credenciales...</p>
    </div>

    <ion-button *ngIf="!isLoading" expand="block" type="submit" [disabled]="loginForm.invalid" class="ion-margin-top">
      Entrar
    </ion-button>
  </form>

  <div class="ion-text-center ion-margin-top">
    <p>¿No tienes cuenta? <a routerLink="/registro">Regístrate aquí</a></p>
  </div>
</ion-content>
