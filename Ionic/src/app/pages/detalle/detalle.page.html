<ion-header>
  <ion-toolbar color="primary">
    <ion-buttons slot="start"><ion-back-button defaultHref="/favoritos"></ion-back-button></ion-buttons>
    <ion-title>Detalles</ion-title>
  </ion-toolbar>
</ion-header>

<ion-content class="ion-padding">
  <div *ngIf="item">
    <h1 class="ion-text-center" style="font-weight: bold;">{{ item.nombre || item.titulo }}</h1>

    <div style="border-radius: 15px; overflow: hidden; margin-bottom: 20px;">
      <ion-img [src]="item.imagen"></ion-img>
    </div>

    <div class="info-container">
      <div *ngIf="item.descripcion_larga">
        <h3 color="primary">Descripción</h3>
        <p>{{ item.descripcion_larga }}</p>
      </div>

      <div *ngIf="item.ingredientes">
        <h3 color="primary">Ingredientes necesarios</h3>
        <p>{{ item.ingredientes }}</p>
      </div>

      <div *ngIf="item.preparacion">
        <h3 color="primary">Pasos de preparación</h3>
        <p>{{ item.preparacion }}</p>
      </div>

      <div *ngIf="item.ejercicios">
        <h3 color="primary">Rutina de ejercicios</h3>
        <p>{{ item.ejercicios }}</p>
      </div>
    </div>

    <ion-button expand="block" [color]="esFavorito ? 'danger' : 'success'" (click)="toggleFavorito()" class="ion-margin-top">
      <ion-icon [name]="esFavorito ? 'trash' : 'star'" slot="start"></ion-icon>
      {{ esFavorito ? 'Quitar de Favoritos' : 'Añadir a Favoritos' }}
    </ion-button>
  </div>
</ion-content>
