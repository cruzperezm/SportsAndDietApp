<ion-header>
  <ion-toolbar color="primary">
    <ion-buttons slot="start">
      <ion-back-button defaultHref="/favoritos"></ion-back-button>
    </ion-buttons>
    <ion-title>Detalles</ion-title>
  </ion-toolbar>
</ion-header>

<ion-content class="ion-padding">
  <div *ngIf="item">

    <div class="ion-margin-bottom">
      <h1>{{ item.nombre || item.titulo }}</h1>
      <p>{{ item.descripcion_larga }}</p>
    </div>

    <ion-img [src]="item.imagen" style="border-radius: 8px; overflow: hidden; box-shadow: 0 4px 8px rgba(0,0,0,0.2);"></ion-img>

    <ion-button
      class="ion-margin-top"
      expand="block"
      [color]="esFavorito ? 'danger' : 'success'"
      (click)="toggleFavorito()">
      <ion-icon [name]="esFavorito ? 'trash' : 'star'" slot="start"></ion-icon>
      {{ esFavorito ? 'Quitar de Favoritos' : 'Añadir a Favoritos' }}
    </ion-button>
  </div>

  <div *ngIf="!item" class="ion-text-center ion-padding">
    <ion-spinner name="crescent"></ion-spinner>
    <p>Cargando detalles...</p>
  </div>
</ion-content>
