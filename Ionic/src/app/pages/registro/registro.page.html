
<ion-toolbar color="primary">
  <ion-title>Crear Cuenta</ion-title> </ion-toolbar>

<ion-content class="ion-padding">
  <div class="header-text">
    <h2>¡Bienvenido!</h2>
    <p>Regístrate para guardar tu perfil y acceder a la app.</p> </div>

  <form [formGroup]="registroForm" (ngSubmit)="onSubmit()">
    <ion-list>
      <ion-item>
        <ion-input label="Email" labelPlacement="floating" type="email" formControlName="email"></ion-input>
      </ion-item>

      <ion-item>
        <ion-input label="Contraseña" labelPlacement="floating" type="password" formControlName="password"></ion-input>
      </ion-item>

      <ion-item>
        <ion-input label="Nombre" label-placement="floating" type="text" formControlName="nombre"></ion-input>
      </ion-item>

      <ion-item>
        <ion-input label="Apellidos" label-placement="floating" type="text" formControlName="apellidos"></ion-input>
      </ion-item>

      <ion-item>
        <ion-input label="URL Foto de Perfil" label-placement="floating" type="url" formControlName="imagen" placeholder="https://..."></ion-input>
      </ion-item>
    </ion-list>

    <ion-text color="danger" *ngIf="errorMessage">
      <p class="ion-text-center">{{ errorMessage }}</p>
    </ion-text>

    <ion-button expand="block" type="submit" [disabled]="registroForm.invalid" class="ion-margin-top">
      Registrarse
    </ion-button>
  </form>

  <div class="ion-text-center ion-margin-top">
    <p>¿Ya tienes cuenta? <a routerLink="/login">Inicia sesión aquí</a></p>
  </div>
</ion-content>
