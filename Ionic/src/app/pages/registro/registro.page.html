<ion-header>
  <ion-toolbar color="primary">
    <ion-title>Crear Cuenta</ion-title>
  </ion-toolbar>
</ion-header>

<ion-content class="ion-padding">
  <div class="header-text ion-text-center">
    <h2>¡Bienvenido!</h2>
    <p>Regístrate para guardar tu perfil y acceder a la app.</p>
  </div>

  <form [formGroup]="registroForm" (ngSubmit)="onSubmit()">

    <ion-item lines="full" class="ion-margin-bottom">
      <ion-label position="stacked">Email</ion-label>
      <input type="email" formControlName="email" class="native-input" placeholder="ejemplo@correo.com" />
    </ion-item>

    <ion-item lines="full" class="ion-margin-bottom">
      <ion-label position="stacked">Contraseña</ion-label>
      <input type="password" formControlName="password" class="native-input" placeholder="******" />
    </ion-item>

    <ion-item lines="full" class="ion-margin-bottom">
      <ion-label position="stacked">Nombre</ion-label>
      <input type="text" formControlName="nombre" class="native-input" placeholder="Tu nombre" />
    </ion-item>

    <ion-item lines="full" class="ion-margin-bottom">
      <ion-label position="stacked">Apellidos</ion-label>
      <input type="text" formControlName="apellidos" class="native-input" placeholder="Tus apellidos" />
    </ion-item>

    <ion-item lines="full" class="ion-margin-bottom">
      <ion-label position="stacked">URL de tu Foto</ion-label>
      <input type="url" formControlName="imagen" class="native-input" placeholder="https://..." />
    </ion-item>

    <ion-text color="danger" *ngIf="errorMessage">
      <p class="ion-text-center">{{ errorMessage }}</p>
    </ion-text>

    <div *ngIf="isLoading" class="ion-text-center ion-margin-top">
      <ion-spinner name="dots" color="primary"></ion-spinner>
      <p>Creando tu cuenta...</p>
    </div>

    <ion-button *ngIf="!isLoading" expand="block" type="submit" [disabled]="registroForm.invalid" class="ion-margin-top">
      Registrarse
    </ion-button>
  </form>

  <div class="ion-text-center ion-margin-top">
    <p>¿Ya tienes cuenta? <a routerLink="/login">Inicia sesión aquí</a></p>
  </div>
</ion-content>
