<ion-app>
  <ion-split-pane contentId="main-content">
    <ion-menu contentId="main-content" type="overlay">
      <ion-header>
        <ion-toolbar color="primary">
          <ion-title>Sports & Diet App</ion-title>
        </ion-toolbar>
      </ion-header>

      <ion-content>
        <div class="ion-padding ion-text-center" *ngIf="usuarioPerfil">
          <ion-avatar style="margin: 0 auto; width: 64px; height: 64px;">
            <img [src]="usuarioPerfil.imagen" /> </ion-avatar>
          <h3>{{ usuarioPerfil.nombre }} {{ usuarioPerfil.apellidos }}</h3>
          <p>{{ usuarioPerfil.email }}</p>
        </div>

        <ion-list>
          <ion-menu-toggle auto-hide="false">
            <ion-item routerLink="/favoritos" routerDirection="root">
              <ion-icon slot="start" name="list"></ion-icon>
              <ion-label>Explorar</ion-label>
            </ion-item>
            <ion-item (click)="logout()">
              <ion-icon slot="start" name="log-out" color="danger"></ion-icon>
              <ion-label color="danger">Cerrar Sesión</ion-label>
            </ion-item>
          </ion-menu-toggle>
        </ion-list>
      </ion-content>
    </ion-menu>

    <ion-router-outlet id="main-content"></ion-router-outlet>
  </ion-split-pane>
</ion-app>
