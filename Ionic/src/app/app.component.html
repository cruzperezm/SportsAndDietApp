<ion-app>
  <ion-split-pane contentId="main-content">

    <ion-menu contentId="main-content" type="overlay" swipe-gesture="true">
      <ion-header>
        <ion-toolbar color="primary">
          <ion-title>Menú</ion-title>
        </ion-toolbar>
      </ion-header>

      <ion-content>
        <div class="ion-padding ion-text-center" *ngIf="usuarioPerfil">
          <ion-avatar style="margin: 0 auto; width: 64px; height: 64px;">
            <img [src]="usuarioPerfil.imagen" />
          </ion-avatar>
          <h3>{{ usuarioPerfil.nombre }} {{ usuarioPerfil.apellidos }}</h3>
          <p>{{ usuarioPerfil.email }}</p>
        </div>

        <ion-list>
          <ion-menu-toggle auto-hide="false">
            <ion-item routerLink="/favoritos" [queryParams]="{vista: 'explorar'}" routerDirection="root" button>
              <ion-icon slot="start" name="compass-outline"></ion-icon>
              <ion-label>Explorar</ion-label>
            </ion-item>

            <ion-item routerLink="/favoritos" [queryParams]="{vista: 'favoritos'}" routerDirection="root" button>
              <ion-icon slot="start" name="heart-outline"></ion-icon>
              <ion-label>Mis Favoritos</ion-label>
            </ion-item>

            <ion-item (click)="logout()" button>
              <ion-icon slot="start" name="log-out-outline" color="danger"></ion-icon>
              <ion-label color="danger">Cerrar Sesión</ion-label>
            </ion-item>
          </ion-menu-toggle>
        </ion-list>
      </ion-content>
    </ion-menu>

    <ion-router-outlet id="main-content"></ion-router-outlet>
  </ion-split-pane>
</ion-app>
