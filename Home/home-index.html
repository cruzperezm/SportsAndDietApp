<!DOCTYPE html>
<html lang="en" xmlns="http://www.w3.org/1999/html">
<head>
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <meta charset="utf-8"/>
  <title>Sports & Diet</title>
  <link rel="stylesheet" href="home.css"/>
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:opsz,wght,FILL,GRAD@20..48,100..700,0..1,-50..200" />
  <script src="../footerheader/global-header-footer.js"></script>
  <script src="cargar-datos.js"></script>
  <script src="../xlu-include-file.js"></script>
</head>
<body>
<div id="main_header" xlu-include-file="../footerheader/header.html"></div>

<main class="home">
  <section class="title">
    <video id="hero-img" class="title-img" src="" muted playsinline aria-hidden="true"></video>
    <h1 id="hero-title" class="title-text"></h1>
  </section>

  <section id="features-container" class="features-section" aria-labelledby="features-heading">
  </section>

  <div id="div-1"></div>

  <section class="diets-preview">
    <section class="diet-preview" aria-labelledby="diets-preview-heading">
      <a id="diet-preview-link" href=""><img id="diet-preview-img" src="" alt="diets preview Image"></a>
      <p id="diet-info-text" class="diet-info"></p>
    </section>
    <section id="diet-gallery-container" class="diet-preview-gallery" aria-labelledby="diets-preview-gallery-heading">
    </section>
  </section>

  <div id="div-2"></div>

  <section class="sports-preview">
    <section class="sport-preview" aria-labelledby="sport-preview-heading">
      <a id="sport-preview-link" href=""><img id="sport-preview-img" src="" alt="sport preview Image"></a>
      <p id="sport-info-text" class="sport-info"></p>
    </section>
    <section id="sport-gallery-container" class="sport-preview-gallery" aria-labelledby="sports-preview-gallery-heading">
    </section>
  </section>

  <div id="div-3"></div>

  <section class="featured-comments" aria-labelledby="featured comments-heading">
    <h2 id="comments-heading"></h2>
    <div id="comments-container" style="display: contents;"></div>
  </section>

  <div id="div-4"></div>

  <section class="sign-up-request" aria-labelledby="sign-up-request-heading">
    <h2 id="sign-up-heading" class="sign-up-text"></h2>
    <div class="sign-up-image-container">
      <img id="sign-up-img" class="sign-up-image" src="" alt="" aria-hidden="true" />
      <a id="sign-up-link" href=""></a>
    </div>

  </section>
</main>
<div id="main_footer" xlu-include-file="../footerheader/footer.html"></div>

<script>
  xLuIncludeFile();
</script>
</body>
</html>
