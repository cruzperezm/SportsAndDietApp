<!DOCTYPE html>
<html>
<meta charset="UTF-16">
<meta name="viewport" content="width=device-width, initial-scale=1">
<head>
    <link rel="stylesheet" href="style.css">
</head>

<body>

<form action="Datos-Biometricos-4.html">
    <div class="box">
        <p>Cuanta actividad haces?</p>
        <div class="radiowrapper">
            <input id="nev" type="radio" name="radio" value="nev">
            <label for="nev" class="form">Nada</label>
        </div>

        <div class="radiowrapper">
            <input id="small" type="radio" name="radio" value="small">
            <label for="small" class="form">Poca</label>
        </div>

        <div class="radiowrapper">
            <input id="mod" type="radio" name="radio" value="mod">
            <label for="mod" class="form">Moderada</label>
        </div>

        <div class="radiowrapper">
            <input id="lots" type="radio" name="radio" value="lots">
            <label for="lots" class="form">Mucha</label>
        </div>

        <div class="radiowrapper">
            <input id="daily" type="radio" name="radio" value="daily">
            <label for="daily" class="form">Todos los días</label>
        </div>

        <div>
            <button onclick="store()" type="submit" class="button">Siguiente</button>
        </div>
    </div>
</form>

<script>
    function store(){
        if (typeof(Storage) !== "undefined") {
            // Store
            localStorage.setItem("activity", document.querySelector("input[name=radio]:checked").value);
        }
    }
</script>

</body>

</html>
