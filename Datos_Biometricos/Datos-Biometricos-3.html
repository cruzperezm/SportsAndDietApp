<!DOCTYPE html>
<html>
<meta charset="UTF-16">
<meta name="viewport" content="width=device-width, initial-scale=1">
<head>
    <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:opsz,wght,FILL,GRAD@24,400,0,0" />
    <link rel="stylesheet" href="style.css">
</head>

<body>

<form action="Datos-Biometricos-4.html">
    <div class="box">
        <p id="activity"></p>
        <div class="radiowrapper">
            <input id="nev" type="radio" name="radio" value="nev">
            <label id="nevT" for="nev" class="form"></label>
        </div>

        <div class="radiowrapper">
            <input id="small" type="radio" name="radio" value="small">
            <label id="smallT" for="small" class="form"></label>
        </div>

        <div class="radiowrapper">
            <input id="mod" type="radio" name="radio" value="mod">
            <label id="modT" for="mod" class="form"></label>
        </div>

        <div class="radiowrapper">
            <input id="lots" type="radio" name="radio" value="lots">
            <label id="lotsT" for="lots" class="form"></label>
        </div>

        <div class="radiowrapper">
            <input id="daily" type="radio" name="radio" value="daily">
            <label id="dailyT" for="daily" class="form"></label>
        </div>

        <div>
            <button id="button" onclick="store()" type="submit" class="button"></button>
        </div>
    </div>
</form>

<script>
    fetch('bio-data.json').then(r => r.json())
        .then(data => {
            document.getElementById('activity').innerText = data.act;
            document.getElementById('nevT').innerText = data.nev;
            document.getElementById('smallT').innerText = data.smallT;
            document.getElementById('modT').innerText = data.mod;
            document.getElementById('lotsT').innerText = data.lots;
            document.getElementById('dailyT').innerText = data.daily;
            document.getElementById('button').innerText = data.btn;
        }).catch(error => console.error('Error loading JSON:', error));

    function store(){
        if (typeof(Storage) !== "undefined") {
            // Store
            localStorage.setItem("activity", document.querySelector("input[name=radio]:checked").value);
        }
    }
</script>

</body>

</html>
