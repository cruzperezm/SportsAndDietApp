<!DOCTYPE html>
<html>
<meta charset="UTF-16">
<meta name="viewport" content="width=device-width, initial-scale=1">

<head>
    <meta charset="utf-8" />
    <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:opsz,wght,FILL,GRAD@24,400,0,0" />
    <link rel="stylesheet" href="style.css">
</head>

<body>

<form action="../Dashboards/Dashboard-Dieta.html" >
    <div class="box">
        <p id="dCal"></p>
        <p id="cal" class="number"></p>
        <p id="mText"></p>
        <p id="weekText" class="smaller"></p>
        <div>
            <button id="finish" type="submit" class="button"></button>
        </div>
    </div>
</form>

<script>
    fetch('bio-data.json').then(r => r.json())
        .then(data => {
            document.getElementById('dCal').innerText = data.dCal;
            document.getElementById('cal').innerText = data.cal;
            document.getElementById('mText').innerText = data.mText;
            document.getElementById('weekText').innerText = data.weekText;
            document.getElementById('finish').innerText = data.finish;
        }).catch(error => console.error('Error loading JSON:', error));
</script>

</body>

</html>
