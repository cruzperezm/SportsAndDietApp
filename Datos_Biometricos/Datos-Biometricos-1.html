<!DOCTYPE html>
<html>
<meta charset="UTF-16">
<meta name="viewport" content="width=device-width, initial-scale=1">
<head>
    <meta charset="utf-8" />
    <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:opsz,wght,FILL,GRAD@24,400,0,0" />
    <link rel="stylesheet" href="style.css">
</head>

<body>

<form action="../Datos_Biometricos/Datos-Biometricos-2.html">
    <div class="box">
        <label id="text1"></label>
        <input id="name" type="text" required>
        <label id="text2"></label>
        <select id="genre" class="selector" required>
            <option id="text3" value="" disabled selected></option>
            <option id="text4" value="Hombre"></option>
            <option id="text5" value="Mujer"></option>
            <option id="text6" value="No-binario"></option>
            <option id="text7" value="PND"></option>
        </select>
        <label id="text8"></label>
        <input id="age" type="number" required>
        <label id="text9"></label>
        <input id="height" type="number" placeholder="cm" required>
        <div>
            <button id="button" onclick="store()" type="submit" class="button"></button>
        </div>
    </div>
</form>

<script>
    fetch('bio-data.json').then(r => r.json())
        .then(data => {
            document.getElementById('text1').innerText = data.nombre;
            document.getElementById('text2').innerText = data.genre;
            document.getElementById('text3').innerText = data.gen1;
            document.getElementById('text4').innerText = data.gen2;
            document.getElementById('text5').innerText = data.gen3;
            document.getElementById('text6').innerText = data.gen4;
            document.getElementById('text7').innerText = data.gen5;
            document.getElementById('text8').innerText = data.edad;
            document.getElementById('text9').innerText = data.altura;
            document.getElementById('button').innerText = data.btn;
        }).catch(error => console.error('Error loading JSON:', error));
    
    function store(){
    if (typeof(Storage) !== "undefined") {
        // Store
        localStorage.setItem("name", document.getElementById("name").value);
        localStorage.setItem("genre", document.getElementById("genre").value);
        localStorage.setItem("age", document.getElementById("age").value);
        localStorage.setItem("height", document.getElementById("height").value);
    }
    }
</script>

</body>

</html>
