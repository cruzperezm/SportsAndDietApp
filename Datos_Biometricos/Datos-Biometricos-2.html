<!DOCTYPE html>
<html xmlns="http://www.w3.org/1999/html">
<meta charset="UTF-16">
<meta name="viewport" content="width=device-width, initial-scale=1">

<head>
    <link rel="stylesheet" href="style.css">
</head>

<body>

<form action="../Datos_Biometricos/Datos-Biometricos-3.html" >
    <div class="box">
        <p>Cual es tu meta?</p>
        <div class="radiowrapper">
            <input id="dec" type="radio" name="radio" value="dec">
            <label for="dec" class="form">Bajar peso</label>
        </div>

        <div class="radiowrapper">
        <input id="inc" type="radio" name="radio" value="inc">
            <label for="inc" class="form">Subir peso</label>
        </div>

        <div class="radiowrapper">
        <input id="mnt" type="radio" name="radio" value="mnt">
            <label for="mnt" class="form">Mantenerse</label>
        </div>

        <div class="radiowrapper">
        <input id="muscle" type="radio" name="radio" value="muscle">
            <label for="muscle" class="form">Musculo</label>
        </div>
        
        <div>
            <button onclick="store()" type="submit" class="button"></button>
        </div>
    </div>
</form>

<script>
    function store(){
        if (typeof(Storage) !== "undefined") {
            // Store
            localStorage.setItem("goal", document.querySelector("input[name=radio]:checked").value);
        }
    }
</script>

</body>

</html>
