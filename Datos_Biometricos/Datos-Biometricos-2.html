<!DOCTYPE html>
<html xmlns="http://www.w3.org/1999/html">
<meta charset="UTF-16">
<meta name="viewport" content="width=device-width, initial-scale=1">

<head>
    <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:opsz,wght,FILL,GRAD@24,400,0,0" />
    <link rel="stylesheet" href="style.css">
</head>

<body>

<form action="../Datos_Biometricos/Datos-Biometricos-3.html" >
    <div class="box">
        <p id="goal"></p>
        <div class="radiowrapper">
            <input id="dec" type="radio" name="radio" value="dec">
            <label id="decT" for="dec" class="form"></label>
        </div>

        <div class="radiowrapper">
        <input id="inc" type="radio" name="radio" value="inc">
            <label id="incT" for="inc" class="form"></label>
        </div>

        <div class="radiowrapper">
        <input id="mnt" type="radio" name="radio" value="mnt">
            <label id="mntT" for="mnt" class="form"></label>
        </div>

        <div class="radiowrapper">
        <input id="muscle" type="radio" name="radio" value="muscle">
            <label id="muscleT" for="muscle" class="form"></label>
        </div>
        
        <div>
            <button id="button" onclick="store()" type="submit" class="button"></button>
        </div>
    </div>
</form>

<script>
    fetch('bio-data.json').then(r => r.json())
        .then(data => {
            document.getElementById('goal').innerText = data.goal;
            document.getElementById('decT').innerText = data.dec;
            document.getElementById('incT').innerText = data.inc;
            document.getElementById('mntT').innerText = data.mnt;
            document.getElementById('muscleT').innerText = data.mscl;
            document.getElementById('button').innerText = data.btn;
        }).catch(error => console.error('Error loading JSON:', error));

    function store(){
        if (typeof(Storage) !== "undefined") {
            // Store
            localStorage.setItem("goal", document.querySelector("input[name=radio]:checked").value);
        }
    }
</script>

</body>

</html>
