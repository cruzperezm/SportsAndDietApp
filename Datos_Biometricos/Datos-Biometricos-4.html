<!DOCTYPE html>
<html>
<meta charset="UTF-16">

<head>

    <link rel="stylesheet" href="style.css">
</head>

<body>

<form action="Datos-Biometricos-5.html" class="box1">Lorem Ipsum Lorem Ipsum?
    <div class="box">
        <label>Peso actual</label>
        <input id="cWeight" type="text" required>
        <label>Peso deseado</label>
        <input id="dWeight" type="text" required>
        <label>Cuantas semanas quieres?</label>
        <input id="nWeeks" type="number">
        <div>
            <button onclick="store()" type="submit" class="button"></button>
        </div>
    </div>
</form>

<script>
    function store(){
        if (typeof(Storage) !== "undefined") {
            // Store
            localStorage.setItem("cWeight", document.getElementById("cWeight").value);
            localStorage.setItem("dWeight", document.getElementById("dWeight").value);
            localStorage.setItem("nWeeks", document.getElementById("nWeeks").value);
        }
    }
</script>

</body>

</html>
