<!DOCTYPE html>
<html>
<meta charset="UTF-16">
<meta name="viewport" content="width=device-width, initial-scale=1">

<head>
    <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:opsz,wght,FILL,GRAD@24,400,0,0" />
    <link rel="stylesheet" href="style.css">
</head>

<body>

<form action="Datos-Biometricos-5.html">
    <div class="box">
        <label>Peso actual</label>
        <input id="cWeight" type="number" placeholder="Kg" required>
        <label>Peso deseado</label>
        <input id="dWeight" type="number" placeholder="Kg" required>
        <label>Cuantas semanas quieres?</label>
        <input id="nWeeks" type="number" required>
        <div>
            <button onclick="store()" type="submit" class="button">Siguiente</button>
        </div>
    </div>
</form>

<script>
    function store(){
        if (typeof(Storage) !== "undefined") {
            // Store
            localStorage.setItem("cWeight", document.getElementById("cWeight").value);
            localStorage.setItem("dWeight", document.getElementById("dWeight").value);
            localStorage.setItem("nWeeks", document.getElementById("nWeeks").value);
        }
    }
    
</script>

</body>

</html>
