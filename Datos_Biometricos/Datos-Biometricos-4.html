<!DOCTYPE html>
<html>
<meta charset="UTF-16">
<meta name="viewport" content="width=device-width, initial-scale=1">

<head>
    <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:opsz,wght,FILL,GRAD@24,400,0,0" />
    <link rel="stylesheet" href="style.css">
</head>

<body>

<form action="Datos-Biometricos-5.html">
    <div class="box">
        <label id="cWeightT"></label>
        <input id="cWeight" type="number" placeholder="Kg" required>
        <label id="dWeightT"></label>
        <input id="dWeight" type="number" placeholder="Kg" required>
        <label id="nWeeksT"></label>
        <input id="nWeeks" type="number" required>
        <div>
            <button id="button" onclick="store()" type="submit" class="button"></button>
        </div>
    </div>
</form>

<script>
    fetch('bio-data.json').then(r => r.json())
        .then(data => {
            document.getElementById('cWeightT').innerText = data.cWht;
            document.getElementById('dWeightT').innerText = data.dWht;
            document.getElementById('nWeeksT').innerText = data.nWeeks;
            document.getElementById('button').innerText = data.btn;
        }).catch(error => console.error('Error loading JSON:', error));

    function store(){
        if (typeof(Storage) !== "undefined") {
            // Store
            localStorage.setItem("cWeight", document.getElementById("cWeight").value);
            localStorage.setItem("dWeight", document.getElementById("dWeight").value);
            localStorage.setItem("nWeeks", document.getElementById("nWeeks").value);
        }
    }
    
</script>

</body>

</html>
