<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Sign Up - Sports & Diet</title>
    <link rel="stylesheet" href="sign-up.css" />

    <script src="../xlu-include-file.js"></script>
    <script src="sign-up.js"></script>
</head>
<body data-json-src="sign-up-data.json" data-page-id="signup">

<main class="wireframe-card">

    <div class="logo-placeholder">
        <img id="signup-avatar" src="" alt="" class="user-avatar" />
    </div>

    <form id="signup-form" class="wireframe-form">

        <div id="signup-inputs-container" style="width: 100%;"></div>

        <p id="signup-message"></p>

        <div id="signup-buttons-container" class="button-row"></div>

        <div class="text-links">
            <p><span id="signup-prefix"></span><a id="signup-login-link" href=""></a></p>
            <p id="signup-forgot-text"></p>
        </div>

        <div id="signup-social-container" class="icon-row"></div>

    </form>
</main>
</body>
</html>
